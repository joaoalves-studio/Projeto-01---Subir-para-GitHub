<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f3;
      color: #06e048;
    }
    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 24px;
    }
    h1 { margin-bottom: 24px; }
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .column {
      background: rgb(229, 9, 9);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }
    .column h2 { margin-top: 0; }
    .item {
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #1b55dc;
      border-radius: 10px;
      background: #1507da;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 20px;
      background: #0b7ddb;
      color: rgb(200, 9, 114);
      margin-bottom: 8px;
    }
    @media (max-width: 700px) {
      .board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Pica Pau</h1>

    <section class="board">
      <div class="column">
        <h2>qualidades</h2>
        <div class="item">
          <span class="tag">01</span>
          <div>nenhuma kkkkk</div>
        </div>
        <div class="item">
          <span class="tag">02</span>
          <div>se na primeira nao tinha pq agora teria kkkkk</div>
        </div>
      </div>

      <div class="column">
        <h2>Defeitos</h2>
        <div class="item">
          <span class="tag">01</span>
          <div>todos kkkkkkk</div>
        </div>
        <div class="item">
          <span class="tag">02</span>
          <div>e mais um pouco kkkkk</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
